name: Catalog pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample = fetch tiny raw samples; build = full catalog build'
        required: true
        default: sample
        type: choice
        options: [sample, build, embed, commons-map]
      limit:
        description: 'max works per source (build mode)'
        required: false
        default: '1500'
      sources:
        description: 'comma-separated sources (build mode)'
        required: false
        default: 'aic,cma'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sample mode — fetch raw records for shape inspection
        if: inputs.mode == 'sample'
        run: npm run -w pipeline run sample
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'sample'
        with:
          name: raw-samples
          path: pipeline/work/samples/
          retention-days: 7

      - name: Build mode — full catalog build with live image probing
        if: inputs.mode == 'build'
        run: npm run -w pipeline run build -- --limit=${{ inputs.limit }} --sources=${{ inputs.sources }} --out=../app/static/catalog

      - name: Embed mode — CLIP embeddings for the committed catalog
        if: inputs.mode == 'embed'
        run: npm run -w pipeline run embed
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'

      - name: Commons-map mode — map AIC works to Wikimedia Commons files
        if: inputs.mode == 'commons-map'
        run: npm run -w pipeline run commons-map

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'build'
        with:
          name: pipeline-report
          path: pipeline/work/report.json
          retention-days: 30

      - name: Commit catalog to the branch
        if: inputs.mode == 'build' || inputs.mode == 'embed' || inputs.mode == 'commons-map'
        run: |
          git config user.name "beholder-pipeline[bot]"
          git config user.email "noreply@github.com"
          git add app/static/catalog
          if [ -f data/commons-map.json ]; then git add data/commons-map.json; fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('app/static/catalog/index.json','utf8')).count)")
            git commit -m "pipeline: ${{ inputs.mode }} — catalog at ${COUNT} works"
            # The branch may have advanced during a long run: rebase and retry.
            n=0
            until git push; do
              n=$((n+1)); [ "$n" -ge 3 ] && exit 1
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi
