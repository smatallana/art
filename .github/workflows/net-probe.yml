name: Net probe

# Ad-hoc network diagnostics from an Actions runner (the sandbox that
# develops this repo cannot reach museum hosts directly). Tramo 7: probe the
# candidate NEW sources before writing adapters — Rijksmuseum's keyless
# APIs/IIIF and the Met's API/CSV, plus SPARQL counts for the
# Commons-image-join ceilings. (The tramo-4 AIC matrix concluded: Cloudflare
# challenges all datacenter clients; findings recorded in DECISIONS.)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Rijksmuseum endpoints
        run: |
          BOT="BeholderPipeline/0.1 (+https://github.com/smatallana/art)"
          t() { desc="$1"; shift; out=$(curl -s -o /tmp/body -w "%{http_code} %{content_type}" --max-time 25 -A "$BOT" "$@" || echo ERR); echo "$out  $desc"; head -c 220 /tmp/body | tr '\n' ' '; echo; echo "---"; sleep 1; }
          t "OAI Identify"            "https://data.rijksmuseum.nl/oai?verb=Identify"
          t "Search collection JSON"  "https://data.rijksmuseum.nl/search/collection?type=schilderij&imageAvailable=true"
          t "Search alt shape"        "https://data.rijksmuseum.nl/search/collection?type=painting"
          t "Linked data object"      -H "Accept: application/ld+json" "https://id.rijksmuseum.nl/200107928"
          t "Old API no key"          "https://www.rijksmuseum.nl/api/en/collection?type=painting&ps=1"

      - name: Met API + CSV
        run: |
          BOT="BeholderPipeline/0.1 (+https://github.com/smatallana/art)"
          t() { desc="$1"; shift; out=$(curl -s -o /tmp/body -w "%{http_code} %{content_type}" --max-time 25 -A "$BOT" "$@" || echo ERR); echo "$out  $desc"; head -c 220 /tmp/body | tr '\n' ' '; echo; echo "---"; sleep 1; }
          t "objects endpoint"   "https://collectionapi.metmuseum.org/public/collection/v1/objects/436535"
          t "search paintings"   "https://collectionapi.metmuseum.org/public/collection/v1/search?medium=Paintings&hasImages=true&q=painting"
          t "CSV head (LFS)"     -r 0-400 "https://media.githubusercontent.com/media/metmuseum/openaccess/master/MetObjects.csv"
          # Image host check with a real primaryImage URL from the API:
          IMG=$(curl -s -A "$BOT" "https://collectionapi.metmuseum.org/public/collection/v1/objects/436535" | python3 -c "import json,sys; print(json.load(sys.stdin).get('primaryImageSmall',''))" || true)
          echo "primaryImageSmall: $IMG"
          if [ -n "$IMG" ]; then t "image GET (bot UA)" "$IMG"; fi

      - name: SPARQL join ceilings (Commons-image route)
        run: |
          BOT="BeholderPipeline/0.1 (+https://github.com/smatallana/art)"
          q() { desc="$1"; query="$2"; n=$(curl -s --max-time 60 -A "$BOT" -H "Accept: application/sparql-results+json" --data-urlencode "query=$query" "https://query.wikidata.org/sparql" | python3 -c "import json,sys; print(json.load(sys.stdin)['results']['bindings'][0]['n']['value'])" || echo ERR); echo "$n  $desc"; sleep 2; }
          q "Met paintings with P3634 + P18" 'SELECT (COUNT(?w) AS ?n) WHERE { ?w wdt:P31/wdt:P279* wd:Q3305213; wdt:P3634 ?met; wdt:P18 ?img }'
          q "Rijksmuseum-collection paintings with P18" 'SELECT (COUNT(?w) AS ?n) WHERE { ?w wdt:P31/wdt:P279* wd:Q3305213; wdt:P195 wd:Q190804; wdt:P18 ?img }'
