name: Deploy worker

on:
  push:
    branches: [claude/arte-painting-discovery-app-nh09q4]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping worker deploy."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision D1 (idempotent) and resolve database_id
        if: steps.creds.outputs.missing == 'false'
        working-directory: worker
        run: |
          npx wrangler d1 create beholder-db 2>/dev/null || echo "beholder-db already exists"
          DB_ID=$(npx wrangler d1 list --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const db=JSON.parse(s).find(d=>d.name==='beholder-db');
              if(!db){console.error('beholder-db not found');process.exit(1);}
              console.log(db.uuid);
            })")
          echo "database_id resolved"
          sed -i "s/REPLACED_AT_DEPLOY/$DB_ID/" wrangler.toml

      - name: Apply D1 migrations
        if: steps.creds.outputs.missing == 'false'
        working-directory: worker
        run: npx wrangler d1 migrations apply beholder-db --remote

      - name: Set Google OAuth secrets (when provided)
        if: steps.creds.outputs.missing == 'false'
        working-directory: worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
            echo "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          else
            echo "::notice::Google OAuth secrets not set — /auth endpoints answer 501 until configured."
          fi

      - name: Ensure workers.dev subdomain (idempotent)
        if: steps.creds.outputs.missing == 'false'
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result?.subdomain??'')}catch{console.log('')}})")
          if [ -n "$SUB" ]; then
            echo "workers.dev subdomain already registered: $SUB"
            exit 0
          fi
          for CAND in beholder-app beholder-smatallana smatallana-beholder; do
            CODE=$(curl -s -o /tmp/sub.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$CAND\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
            if [ "$CODE" = "200" ]; then
              echo "registered workers.dev subdomain: $CAND"
              exit 0
            fi
            echo "candidate $CAND rejected (HTTP $CODE): $(cat /tmp/sub.json | head -c 300)"
          done
          echo "::warning::Could not register a workers.dev subdomain automatically. One-time manual step: dash.cloudflare.com → Workers & Pages → set your workers.dev subdomain, then re-run this workflow."

      - name: Deploy
        if: steps.creds.outputs.missing == 'false'
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          URL=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 || true)
          echo "::notice::Worker deployed at: ${URL:-unknown}"

      - name: Smoke test /health (retries for fresh-subdomain DNS)
        if: steps.creds.outputs.missing == 'false'
        working-directory: worker
        run: |
          URL=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::warning::could not determine worker URL for smoke test"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -sSf "$URL/health"; then echo; echo "health OK"; exit 0; fi
            echo "attempt $i failed (DNS may still be propagating); retrying in 20s"
            sleep 20
          done
          echo "::warning::$URL/health still unreachable - fresh workers.dev subdomains can take minutes of DNS propagation; re-run this workflow if it persists."
